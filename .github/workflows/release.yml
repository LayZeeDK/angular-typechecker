# Hardened publish workflow (PKG-04 / D-13 / D-15 / D-16).
#
# Threat model (s1ngularity + TanStack postmortems):
#   - NEVER use the untrusted-PR-code trigger: an untrusted PR title interpolated
#     into a privileged run: step was the s1ngularity command-injection +
#     token-leak vector. This workflow triggers on TAG PUSH only (+ manual
#     dispatch).
#   - Least privilege: contents read-only at the top level; the publish job
#     re-grants ONLY id-token: write (the GitHub release is cut LOCALLY per D-13,
#     so no repo-write permission is needed here).
#   - Workflow-scoped trust: the npm Trusted Publisher is pinned to THIS exact
#     workflow filename (release.yml) + the named environment. The whole-repo
#     trust scope was the TanStack vector; the EXACT filename + environment below
#     are load-bearing and must match the npm Trusted Publisher registered at
#     05-05.
#   - SHA-pinned actions: every action reference is a full 40-char commit SHA (a
#     mutable major-version tag repointed to malicious code was the tj-actions
#     vector). Dependabot (.github/dependabot.yml, github-actions ecosystem)
#     keeps these fresh.
#   - persist-credentials: false so a checkout credential cannot be persisted to
#     .git/config and leaked via an artifact/log.
#   - Tokenless OIDC publish: the npm auth-token env var is left entirely UNSET
#     (an empty value breaks OIDC and yields a misleading 404 -- Pitfall 2);
#     NPM_CONFIG_PROVENANCE: true keeps the provenance attestation on.
name: release

on:
  push:
    tags:
      - 'angular-typechecker@*'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # The environment MUST have a Required Reviewer configured in repo settings;
    # it is the manual-approval gate on the publish job (the control Nx itself
    # adopted post-incident). Its name is load-bearing: it must match the npm
    # Trusted Publisher config registered at 05-05.
    environment: npm-publish
    permissions:
      # ONLY id-token: write -- mints the OIDC identity npm validates. No
      # repo-write permission (the GitHub release is created locally per D-13).
      id-token: write
    # Additive defense-in-depth (RD-07): the publish job is unreachable unless
    # the ref is a release tag, independent of the `on:` block above -- so a
    # later-broadened trigger still cannot fire a publish on a non-tag ref. The
    # `on: push: tags:` filter stays the primary gate; this also lets `act`
    # discriminate tag-push (publish SELECTED) from branch-push (publish SKIPPED)
    # since act evaluates `if:` but not `on:` filters.
    if: startsWith(github.ref, 'refs/tags/angular-typechecker@')
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          # registry-url is REQUIRED for npm to DETECT the OIDC trusted-publishing
          # environment. Without it npm never attempts OIDC and fails with ENEEDAUTH
          # (empirically confirmed on 0.0.2). npm >= 11.5.1 (installed below) runs the
          # OIDC handshake FIRST and ignores setup-node's empty _authToken placeholder,
          # so do NOT drop registry-url. A 404 here means the npm Trusted Publisher does
          # NOT exactly match the OIDC claims (org/user casing, repo, workflow filename
          # release.yml, environment npm-publish) -- fix the TP on npmjs.com.
          registry-url: https://registry.npmjs.org/
      # setup-node writes a deprecated `always-auth=true` into the .npmrc it generates
      # for registry-url; npm 11 no longer recognizes it and warns on every command.
      # Strip it (cosmetic only -- OIDC is unaffected and registry-url must stay). The
      # NPM_CONFIG_USERCONFIG path is exported by setup-node above.
      - run: |
          if [ -n "$NPM_CONFIG_USERCONFIG" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i '/^always-auth=/d' "$NPM_CONFIG_USERCONFIG"
          fi
      - run: npm i -g npm@latest
      - run: npm ci
      # CI is a fresh checkout and dist/ is gitignored, so the publishable output
      # must be (re)built here before publish. The local `nx release --skip-publish`
      # build (preVersionCommand) does not carry into this job (D-13 split).
      - run: npx nx build angular-typechecker
      - run: npx nx release publish
        env:
          NPM_CONFIG_PROVENANCE: true
          # The npm auth-token env var is deliberately NOT declared here -- OIDC
          # engages only with no token present (an empty value would break it).
          #
          # SEED COMPLETE: 0.0.1 was published 2026-06-28 with provenance via a
          # one-time granular bypass-2FA token (the first publish cannot use OIDC --
          # npm/cli#8544). This workflow is now OIDC-only: the npm Trusted Publisher
          # (repo LayZeeDK/angular-typechecker, workflow release.yml, env npm-publish)
          # authenticates every subsequent release tokenlessly. Do NOT add
          # NODE_AUTH_TOKEN -- a token is unnecessary and npm >= 11.5.1 handles the
          # empty placeholder. (0.0.2's first OIDC attempts failed two ways: a 404 with
          # registry-url present and ENEEDAUTH with it removed. Root cause is the npm
          # Trusted Publisher exact-match config on npmjs.com -- never validated because
          # 0.0.1 used a token, not OIDC. Verify the TP repo/workflow/environment match;
          # keep registry-url for OIDC detection.)

# Cross-OS / multi-Node CI gate (CI-01).
#
# Threat model (matches release.yml; s1ngularity + tj-actions postmortems):
#   - Untrusted-PR trust scope: this workflow uses the SAFE pull-request trigger
#     (the code-checkout variant, never the privileged sibling). It never
#     interpolates a PR title/branch/author into a privileged run step -- every
#     run step uses fixed target ids + flags only. There is no command-injection
#     surface from untrusted PR metadata.
#   - Least privilege: read-only repo scope at the top level; NO job re-grants any
#     write permission (this is a test gate, never a publisher). The format-lint job
#     adds a job-level, READ-ONLY actions: read (nx-set-shas base derivation) on top
#     of contents: read -- still zero write scope anywhere. It sets no registry
#     credentials and no auth-token env -- OIDC publishing is release.yml's concern
#     alone.
#   - SHA-pinned actions: every action reference is a full 40-char commit SHA (a
#     mutable major-version tag repointed to malicious code was the tj-actions
#     vector). Dependabot (.github/dependabot.yml, github-actions ecosystem) keeps
#     these fresh and bumps them in lockstep with release.yml's shared pins.
#   - persist-credentials disabled on every checkout so a checkout credential
#     cannot be persisted to .git/config and leaked via an artifact or log.
#   - concurrency cancel-in-progress reaps superseded PR runs.
name: ci

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Path-aware change detection (D-08 / REL-02 DX). ~58% of this repo's commits
  # are `.planning/`-only, so a planning-only PR must NOT burn the full cross-OS
  # matrix. The diff is classified INSIDE the workflow (never via an `on:`
  # `paths-ignore`, which would make a required-named check never report and
  # deadlock the merge button on "Expected -- waiting for status"). The workflow
  # always triggers; this job computes whether the diff touches anything OUTSIDE
  # the planning/docs set; the heavy jobs gate on its output; the `ci` aggregate
  # always runs and reports. dorny/paths-filter is SHA-pinned like every other
  # action here (Dependabot keeps it fresh). No extra permissions beyond the
  # top-level `contents: read` are needed -- paths-filter diffs base..head from
  # the checkout on pull_request.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      formatlint: ${{ steps.filter.outputs.formatlint }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          # `code` is true when the diff touches anything OUTSIDE the
          # planning/docs set. `predicate-quantifier: every` is LOAD-BEARING with
          # all-negation globs: a changed file counts toward `code` only if it
          # satisfies EVERY pattern (i.e. is NOT under .planning, NOT *.md, NOT
          # under docs) -- a real code file. With the default `some` quantifier a
          # `.planning/x.md` file would match `!docs/**` (it is not under docs/)
          # and wrongly set code=true, so the matrix would never skip. Proven on a
          # planning-only probe PR: `every` -> code=false -> test/e2e skipped while
          # the `ci` aggregate still reports green (no deadlock).
          #
          # `formatlint` is BROADER than `code`: it is true when the diff touches
          # anything OUTSIDE .planning (the only tree in .prettierignore). It gates
          # the format-lint job ALONE, so a docs/markdown-only PR that edits a
          # Prettier-owned file (README.md, AGENTS.md, CLAUDE.md, CHANGELOG.md, a
          # non-.planning doc) still runs format:check -- otherwise the tarball's
          # README could drift out of Prettier compliance and ship (C9). A
          # .planning-only PR (all files ignored by Prettier) still sets
          # formatlint=false so format-lint skips it.
          predicate-quantifier: 'every'
          filters: |
            code:
              - '!.planning/**'
              - '!**/*.md'
              - '!docs/**'
            formatlint:
              - '!.planning/**'

  # Unit + integration on the LEAN 6-cell matrix (RD-01): full Node sweep on
  # Linux + the OS axis on Node 24 + the one worth-keeping cross-cell
  # (windows x newest Node, the OS most prone to ESM/path regressions). NO
  # arm64-specific runners and NO `architecture` pin -- arch is correctness-
  # irrelevant for a pure-JS ngtsc type-checker; macos-latest is arm64 by
  # GitHub's default. fail-fast:false so one red cell never masks the others.
  #
  # Path-gated (D-08): runs UNLESS the PR diff is planning/docs-only. The
  # NEGATIVE if: form (`!= 'false'`) is load-bearing -- under `act -n` the filter
  # output is empty, and `'' != 'false'` is true, so the job stays in the act
  # plan and the act-compat assertions keep passing (RESEARCH Pitfall 3 / A3).
  test:
    needs: changes
    if: ${{ needs.changes.outputs.code != 'false' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: ubuntu-latest, node: 26 }
          - { os: windows-latest, node: 24 }
          - { os: windows-latest, node: 26 }
          - { os: macos-latest, node: 24 }
    env:
      NX_DAEMON: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Unified type-check gate (folds the former typecheck-drift + typecheck-e2e):
      # run-many runs the `typecheck` target for EVERY project that defines it --
      # the plugin (spec + drift + tooling configs), the app, the consumer libs,
      # test-util, the root clean fixtures, and the e2e sources. It is the biggest
      # coverage surface, so it runs FIRST and fails fast. OS-independent and
      # Nx-cached per its inputs, so per-matrix-cell re-runs are cheap. Fixed target
      # ids + flags only; no PR-metadata interpolation.
      - run: npx nx run-many -t typecheck
      # Fast unit tier: run-many runs `test` for the two projects that define it
      # (plugin + test-util). test-util is covered so @workspace/test-util's own
      # unit tests (findWorkspaceRoot, incl. the negative-throw + depth-independence
      # cases) run in CI, not just when a consuming spec exercises the happy path.
      - run: npx nx run-many -t test
      # Real-compiler integration tier: the plugin's *.integration.spec.ts, each a
      # cold @angular/compiler-cli performCompilation. Runs after the fast tier so a
      # unit regression fails first.
      - run: npx nx run-many -t integration

  # e2e project discovery (Lever A, quick-260715-050). Emits the e2e project list
  # into `outputs.projects`, feeding the `e2e` job's DYNAMIC matrix so a NEW e2e
  # project is auto-covered with NO static list to drift. Deliberately LEAN: a
  # pure `node` fs-read of `e2e/*/project.json` (tools/ci/list-e2e-projects.mjs),
  # NOT `npm ci` + `nx show projects` -- discovery needs no install or build, so
  # this is a ~seconds checkout + node step in front of the matrix. The plugin is
  # (re)built PER e2e cell via each e2e project's own `e2e`-target
  # dependsOn:angular-typechecker:build (~2-4s -- a tiny @nx/js:tsc lib): a
  # cross-runner build-artifact handoff was MEASURED to be a no-op (nx rejects a
  # foreign `.nx/cache` as `unknown-local-cache`) and was dropped. Path-gated
  # (D-08), same NEGATIVE if: form as the heavy jobs so it stays in the `act -n`
  # plan under the empty filter output. Read-only: inherits `contents: read`.
  discover:
    needs: changes
    if: ${{ needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.list.outputs.projects }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # Pure fs read via the runner's ambient node (no setup-node/npm ci needed --
      # the script uses only node:fs/path/url). GUARD-01b asserts this CLI output
      # equals GUARD-01's enumeration, so the matrix cannot drift from the real
      # e2e projects. The command substitution is a SEPARATE assignment (NOT
      # `echo "$(...)"`) so a script failure trips `set -e` and fails the job
      # LOUD -- inside an `echo` argument a failed substitution writes an empty
      # `projects=` and exits 0, which would silently engage the e2e job's
      # hardcoded fallback list in real CI.
      - id: list
        run: |
          projects=$(node tools/ci/list-e2e-projects.mjs)
          echo "projects=$projects" >> "$GITHUB_OUTPUT"

  # Heavy tarball-install gate, split into a per-project matrix (Lever A,
  # quick-260715-050), Linux-only (RD-03), Node 24 (matching release.yml). One
  # matrix cell per nx e2e project, so the CPU-bound typecheck + install work
  # parallelises across runners instead of running serially in a single job. The
  # matrix is DYNAMIC: `fromJSON(needs.discover.outputs.projects ...)` consumes the
  # `discover` job's `tools/ci/list-e2e-projects.mjs` output, so a NEW e2e project
  # is auto-covered (there is no authoritative static list to drift; GUARD-01b
  # asserts this wiring). The `|| '[...]'` fallback is a non-authoritative
  # single-element act-plan placeholder, NOT a coverage source: under `act -n` the
  # empty discover output would make bare `fromJSON('')` error and drop `ci/e2e`
  # from the plan, so the fallback only needs one sentinel token to keep the job in
  # the plan. Real CI always uses the discover-job output.
  #
  # Each cell (re)builds `angular-typechecker` via its own `e2e`-target
  # dependsOn:angular-typechecker:build (GUARD-01e) -- ~2-4s for this small
  # @nx/js:tsc lib. A cross-runner build-artifact handoff was MEASURED to be a
  # no-op (nx rejects a foreign `.nx/cache` as `unknown-local-cache`), so cells
  # rebuild: cheap, and it keeps the LOCAL full-tier flow + GUARD-01e intact. On a
  # fresh runner the dependsOn is what prevents an ENOENT on the built dist.
  #
  # install-e2e + cache-e2e stay `parallelism: false` and every packing spec
  # keeps its own `--pack-destination`. Those isolation invariants are no longer
  # what lets CI cells run concurrently (each cell is its own runner), but the
  # LOCAL full-tier run (`nx run-many -t e2e --parallel=2`) still relies on them,
  # so GUARD-01b keeps asserting them.
  #
  # Path-gated (D-08), same NEGATIVE if: form as `test` -- skips a planning/docs-
  # only PR yet stays in the `act -n` plan under the empty filter output.
  e2e:
    needs: [changes, discover]
    if: ${{ needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.discover.outputs.projects || '["angular-typechecker-cache-e2e"]') }}
    env:
      NX_DAEMON: false
      # The matrix project is passed to the run steps through this env var, never
      # interpolated as ${{ matrix.project }} into a shell command. The value derives
      # from a fork-PR-controlled e2e/*/project.json `name`, so an env var (set by the
      # runner, not evaluated by the shell) keeps the top-of-file no-command-injection
      # invariant true.
      PROJECT: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      # Put the yarn 4 shim on PATH for the nx-add-yarn spec: nx add's child
      # `yarn add` is a BARE `yarn` invocation, so yarn must resolve on PATH.
      # Node 24 ships corepack; `corepack enable` is corepack's sanctioned shim
      # install (not a manual PATH edit). The pnpm fixture pins pnpm@11.9.0 (same
      # version pnpm/action-setup provides), so a corepack pnpm shim resolves the
      # identical version -- no clash with the action-setup pnpm below.
      # NODE COUPLING (reconcile with the job's own "corepack is removed from Node
      # 25+" note above): this step REQUIRES corepack, which ships through Node 24
      # (this job's node-version pin) but is REMOVED in Node 25+. If this job's
      # node-version is ever bumped to >=25, `corepack enable` will not exist --
      # provision yarn via a pinned setup step (mirroring the pnpm/action-setup
      # below) or gate this step on the Node major instead.
      - run: corepack enable
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
      - run: npm ci
      # Static type-check gate for THIS cell's e2e SOURCES, run BEFORE the
      # multi-minute tarball install so a type error in an e2e spec fails fast
      # (~15s) instead of after the install. SCOPED to this cell's single project
      # via `-p "$PROJECT"` -- the matrix value is passed through the `PROJECT` env
      # var, never interpolated into the shell command (top-of-file
      # no-command-injection invariant): the `test` job already runs the FULL
      # whole-repo `nx run-many -t typecheck` across the OS x Node matrix, so this
      # is only the pre-install fast-fail for the one project the cell installs.
      # GUARD-01c asserts this line runs `run-many -t typecheck`.
      - run: npx nx run-many -t typecheck -p "$PROJECT"
      # Run the `e2e` target for THIS cell's project only (`-p "$PROJECT"` -- the
      # matrix value passed through the `PROJECT` env var, never interpolated into
      # the shell command, per the top-of-file no-command-injection invariant).
      # The plugin is (re)built for this cell via the e2e target's
      # dependsOn:angular-typechecker:build (GUARD-01e), ~2-4s -- there is NO
      # build-artifact handoff (a foreign `.nx/cache` restore is a no-op). GUARD-01/01b
      # assert this invocation and the dynamic matrix wiring.
      - run: npx nx run-many -t e2e -p "$PROJECT"

  # Code-quality gate (QUAL-01): fallow audit in new-only mode -- a PR fails only
  # for dead code / duplication / over-complexity it INTRODUCES. Config-pinned
  # gate (.fallowrc.jsonc `audit.gate: new-only`); --format human renders a readable
  # report in the CI log, the exit code gates. SARIF output (--ci) is DEFERRED to a
  # later milestone -- it would need security-events: write, contradicting the
  # top-level contents: read. fallow is an exact-pinned root
  # devDependency installed by `npm ci`; `npx fallow` resolves the locked version
  # (never @latest) so a fallow release cannot silently flip the gate.
  #
  # fetch-depth: 0 is LOAD-BEARING -- new-only attribution runs a base-snapshot
  # pass against origin/main's merge-base; a shallow checkout breaks new-vs-
  # inherited attribution. FALLOW_AUDIT_BASE pins the base ref defensively.
  #
  # Path-gated (D-08), SAME NEGATIVE if: form as test/e2e -- skips a planning/docs-
  # only PR yet stays in the `act -n` plan under the empty filter output.
  fallow:
    needs: changes
    if: ${{ needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx fallow audit --format human --base origin/main
        env:
          FALLOW_AUDIT_BASE: origin/main

  # Format + lint quality gate (QUAL-02). OS-independent, Linux-only, single Node
  # (Prettier/ESLint verdicts do not vary by OS or Node minor). nrwl/nx-set-shas
  # derives the base/head SHAs so `nx format:check` inspects ONLY the files this
  # PR/push range changed -- never the whole repo (the repo carries intentionally
  # un-Prettier'd fixtures + a large .planning tree). `nx run-many -t lint` lints
  # every project that defines a lint target and fails on ANY warning: maxWarnings:0
  # is baked into the @nx/eslint:lint targetDefaults (nx.json), so NO CI flag is
  # passed. fetch-depth: 0 is LOAD-BEARING -- nx-set-shas resolves the base commit
  # from git history. On a PR it derives the exact merge-base/head; on a push it
  # reads the last successful run to compute the base (see the actions: read note
  # on the permissions block below). Path-gated (D-08) on the BROADER `formatlint`
  # output (NOT `code`): it runs whenever any non-.planning file changes -- so a
  # docs/markdown-only PR still gets format:check'd (the shipped README is
  # Prettier-owned; C9) while a .planning-only PR still skips. Same NEGATIVE if:
  # form (`!= 'false'`), so it stays in the `act -n` plan under the empty filter
  # output. Fixed target ids + flags only; no PR-metadata interpolation.
  format-lint:
    needs: changes
    if: ${{ needs.changes.outputs.formatlint != 'false' }}
    runs-on: ubuntu-latest
    # actions: read is required by nrwl/nx-set-shas -- on a push it queries the
    # Actions workflow-runs API for the last successful run to derive the base SHA
    # (on a PR it uses git merge-base and needs no API). Job-level permissions
    # REPLACE (not merge with) the top-level block, so contents: read is restated
    # here for actions/checkout. Both scopes are READ-ONLY -- no write is granted.
    permissions:
      contents: read
      actions: read
    env:
      NX_DAEMON: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
        id: nx-shas
      - run: npm ci
      - run: npx nx format:check --base=${{ steps.nx-shas.outputs.base }} --head=${{ steps.nx-shas.outputs.head }}
      - run: npx nx run-many -t lint

  # act-compatibility gate (RD-06): container-free `act --validate`
  # (parseability) + `act -n` per trigger (trigger/condition fidelity via the
  # if:-gated job selection). NEVER plain `act <event>` execution -- no nested
  # Docker. act is pinned to v0.2.89.
  act-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install act (pinned v0.2.89)
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/nektos/act/master/install.sh | sudo bash -s -- -b /usr/local/bin v0.2.89
          act --version
      - name: act compatibility suite (validate + dry-run per trigger)
        run: bash tools/act/act-compat.sh

  # Static workflow validation (RD-08): actionlint type-checks expressions, the
  # needs.*.result graph, matrix references, runs-on labels, and shellchecks run
  # steps. Container-free. Complements act's parseability check.
  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install actionlint (pinned)
        run: |
          bash <(curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -version
      - name: Lint workflows
        run: ./actionlint -color

  # Always-run regression guard (NEVER path-gated). The scoped-name + executor-id
  # resolution guards (packages/angular-typechecker/src/scoped-name-guard.spec.ts)
  # must run on EVERY PR -- including a docs-only PR, where the code-gated `test`
  # job is skipped yet a stray scoped ref pasted into the shipped README would
  # otherwise ship green (E1). It runs the dedicated `scoped-name-guard` target
  # (packages/angular-typechecker/project.json), which is `cache: false` so the
  # whole-repo scan ALWAYS re-executes rather than replaying a per-project cache hit
  # that a stray ref in another project never busts (E3), and is an `nx:run-commands`
  # vitest run over ONLY the guard spec with NO `dependsOn: build` -- the guard reads
  # files (git ls-files + JSON), needs no compiled output, and stays decoupled from
  # the plugin's compilability (a docs-only PR pays no build). OS/Node-independent, so
  # Linux + single Node. Read-only; inherits top-level `contents: read`.
  scoped-name-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx nx scoped-name-guard angular-typechecker

  # Aggregate gate (RD-09 / D-02 cross-phase contract). Job id AND name are
  # EXACTLY `ci` -- the exact required-status-check name Phase 7's Default branch
  # ruleset will consume. needs all upstream jobs (incl. the new `changes`);
  # if:always() so it runs even when a dependency failed or was path-skipped;
  # fail-closed on failure OR cancelled. The contains(needs.*.result, ...) form
  # aggregates every matrix cell (a plain needs.test.result != 'success' can read
  # success when one cell passes under fail-fast:false).
  #
  # Path-skip rework (D-08): `'skipped'` is DROPPED from the fail set -- a heavy
  # job intentionally path-skipped on a planning/docs-only PR is now acceptable,
  # so `ci` reports success and the merge button is not deadlocked. `cancelled`
  # STAYS in the fail set as the backstop: a genuinely mis-skipped or aborted
  # dependency that GitHub reports as `cancelled` still fails the gate, and the
  # post-merge `main` `ci` run (which has a real code diff vs its parent on a
  # code merge) is the second backstop.
  ci:
    needs:
      [
        changes,
        discover,
        test,
        e2e,
        fallow,
        format-lint,
        act-compat,
        lint-workflows,
        scoped-name-guard,
      ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Gate
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "A required job failed or was cancelled"
            exit 1
          fi
          echo "All required jobs succeeded or were intentionally path-skipped"
